<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>koneko</title>
    <meta name="koneko-view" content="@routeName">
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flag-icons@7.2.3/css/flag-icons.min.css"
        integrity="sha384-aQuvIWWIbpu/mSqULLDiUveyYiPoJzPKAWjUmGJ+Elm+N/LJhzfZqsutsfw870JS"
        crossorigin="anonymous">
    
    <link rel="preconnect" href="https://fonts.cdnfonts.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.cdnfonts.com/css/torus"
        integrity="sha384-e63PxU+bF69fxq4IOqAiqfEE+pVdhdmzPznvU+9nLWvx6JESH/MwQc1IoJJ4rn6D"
        crossorigin="anonymous">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css"
        integrity="sha512-1ycn6IcaQQ40/MKBW2W4Rhis/DbILU74C1vSrLJxCq57o941Ym01SwNsOMqvEBFlcgUa6xLiPY/NS5R+E6ztJQ=="

    <link rel="stylesheet" href="/css/home-panels.css?v=home-panels-13">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap">

    <link rel="stylesheet" href="/css/osu-theme.css?v=theme-10">

@pluginHead
</head>
<body>

<a class="skip-link" href="#koneko-app">Skip to content</a>

<main id="koneko-app" tabindex="-1" v-cloak>
    <theme-runtime></theme-runtime>
    @routeComponent
</main>

<script src="/data/bootstrap.js"></script>

<script src="https://unpkg.com/vue@3.5.13/dist/vue.global.prod.js"
    integrity="sha384-W/1Fp/LgAYO/oTn9Gs+PbeWuMuq1eQCnUMPCeg8POmMYchhzxctjEqtbiCIxDOON"
    crossorigin="anonymous"></script>

<script>

    const koneko = window.__koneko || { site: {}, user: null, domain: "" };

    // A browser reload (F5) is not a visit: it asks for fresh scores. The stats of a profile and the other page data
    // stay cached, but whatever holds scores is dropped here, before any page gets to read it. Moving between pages
    // (links, back/forward) is not a reload and keeps every cache.
    (function dropScoresOnReload() {
        try {
            const entries = performance.getEntriesByType("navigation");

            if (!entries.length || entries[0].type !== "reload") return;

            const prefix = "koneko:fast:";
            const scoreParts = ["best", "recent", "firstPlaces", "mostPlayed", "topScores"];

            for (let i = window.localStorage.length - 1; i >= 0; i--) {
                const name = window.localStorage.key(i);

                if (!name || name.indexOf(prefix) !== 0) continue;

                const key = name.substring(prefix.length);

                // A single score page is nothing but a score.
                if (key.indexOf("score:") === 0) {
                    window.localStorage.removeItem(name);
                    continue;
                }

                if (key !== "home" && key.indexOf("profile:") !== 0) continue;

                const entry = JSON.parse(window.localStorage.getItem(name));

                if (!entry || !entry.body) continue;

                scoreParts.forEach(part => { delete entry.body[part]; });
                window.localStorage.setItem(name, JSON.stringify(entry));
            }

            console.info("[turbo] reload: cached scores dropped, stats kept");
        } catch (e) {
            // storage is optional
        }
    })();

    // The root owns which page component is on screen, so turbo.js can swap it without a page load.
    const app = Vue.createApp({
        data() {
            const meta = document.querySelector('meta[name="koneko-view"]');

            return { view: meta ? meta.content : "", navKey: 0 };
        }
    });

    app.config.globalProperties.$koneko = koneko;

    app.mixin({
        methods: {

            fastKey(key) {
                return "koneko:fast:" + key;
            },
            fastLoad(key) {
                const settings = koneko.fastload || {};

                if (!settings.enabled) return null;

                // Pages visited in this tab are served from memory: no storage read, no JSON parse.
                const hot = window.__konekoFast && window.__konekoFast.get(key);

                if (hot) {
                    const ttl = (settings.clientTtl || 0) * 1000;

                    if (!ttl || Date.now() - hot.storedAt <= ttl) return hot.body;

                    window.__konekoFast.delete(key);
                }

                try {
                    const raw = window.localStorage.getItem(this.fastKey(key));
                    if (!raw) return null;

                    const entry = JSON.parse(raw);
                    if (!entry || !entry.body) return null;

                    const ttl = (settings.clientTtl || 0) * 1000;

                    if (ttl > 0 && Date.now() - entry.storedAt > ttl) {
                        window.localStorage.removeItem(this.fastKey(key));
                        return null;
                    }

                    return entry.body;
                } catch (e) {
                    return null;
                }
            },
            fastSave(key, body) {
                const settings = koneko.fastload || {};

                if (!settings.enabled || !body) return;

                if (!window.__konekoFast) window.__konekoFast = new Map();

                window.__konekoFast.set(key, { storedAt: Date.now(), body: body });

                try {
                    window.localStorage.setItem(this.fastKey(key), JSON.stringify({
                        storedAt: Date.now(),
                        body: body
                    }));
                } catch (e) {

                }
            },

            apiBase() {
                return String(koneko.apiBase || "/api/v1").replace(/\/+$/, "");
            },
            
            async api(endpoint, params) {
                const query = new URLSearchParams();

                Object.keys(params || {}).forEach(name => {
                    const value = params[name];

                    if (value === null || value === undefined || value === "") return;

                    query.set(name, String(value));
                });

                const suffix = query.toString() ? "?" + query.toString() : "";

                const response = await fetch(this.apiBase() + "/" + endpoint + suffix, {
                    headers: { "Accept": "application/json" },

                    credentials: "omit"
                });

                if (!response.ok) {
                    const error = new Error(endpoint + " answered " + response.status);
                    error.status = response.status;
                    throw error;
                }

                return await response.json();
            },

            async apiQuietly(endpoint, params) {
                try {
                    return await this.api(endpoint, params);
                } catch (e) {
                    return null;
                }
            },
            
            async playerApi(endpoint, params) {
                const query = new URLSearchParams();

                Object.keys(params || {}).forEach(name => {
                    const value = params[name];

                    if (value === null || value === undefined || value === "") return;

                    query.set(name, String(value));
                });

                const suffix = query.toString() ? "?" + query.toString() : "";

                const response = await fetch("/data/player/" + endpoint + suffix, {
                    headers: { "Accept": "application/json" },
                    credentials: "same-origin"
                });

                if (!response.ok) {
                    const error = new Error(endpoint + " answered " + response.status);
                    error.status = response.status;
                    throw error;
                }

                return await response.json();
            },

            async playerApiQuietly(endpoint, params) {
                try {
                    return await this.playerApi(endpoint, params);
                } catch (e) {
                    return null;
                }
            },
            
            async session(method, path, body) {
                const response = await fetch(path, {
                    method: method,
                    headers: {
                        "Accept": "application/json",
                        "Content-Type": "application/json"
                    },
                    credentials: "same-origin",
                    body: body === undefined ? undefined : JSON.stringify(body)
                });

                let answer = null;

                try {
                    answer = await response.json();
                } catch (e) {
                    answer = null;
                }

                if (!response.ok) {
                    const error = new Error((answer && answer.status)
                        || "The server could not be reached.");
                    error.status = response.status;
                    throw error;
                }

                return answer;
            },

            apiWho(identifier) {
                const value = String(identifier === null || identifier === undefined
                    ? "" : identifier);

                return /^[0-9]+$/.test(value) ? { id: value } : { name: value };
            },
            fmtNumber(value) {
                return (value === null || value === undefined) ? "-" : Number(value).toLocaleString();
            },
            fmtDecimal(value, digits) {
                if (value === null || value === undefined) return "-";
                return Number(value).toFixed(digits === undefined ? 2 : digits);
            },
            fmtAccuracy(value) {
                if (value === null || value === undefined) return "-";

                return (Number(value) * 100).toFixed(2) + "%";
            },

            statusName(status) {
                const names = {
                    "-2": "graveyard",
                    "-1": "work in progress",
                    "0": "pending",
                    "1": "ranked",
                    "2": "approved",
                    "3": "qualified",
                    "4": "loved"
                };

                return names[String(status)] || "unknown";
            },
            modeName(mode) {
                const names = ["osu!", "taiko", "catch", "mania"];
                return names[Number(mode)] || "osu!";
            },
            fmtLength(seconds) {
                const total = Number(seconds);

                if (!total || total < 0) return "0:00";

                const minutes = Math.floor(total / 60);
                const rest = Math.floor(total % 60);

                return minutes + ":" + String(rest).padStart(2, "0");
            },

            coverUrl(setId, size) {
                if (!setId) return "";

                // Thumbnails are cut down and re-encoded as WebP by this server (ImageRoutes) and cached for good.
                return "/img/cover/" + encodeURIComponent(setId) + "/" + (size || "card") + ".webp";
            },

            flagClass(code) {
                if (!code) return "";

                const value = String(code).trim().toLowerCase();

                if (!/^[a-z]{2}$/.test(value)) return "";

                return "fi fi-" + value;
            },

            groupStyle(group) {
                const raw = String((group && group.colour) || "");
                const colour = /^[0-9a-fA-F]{6}$/.test(raw) ? raw : "8a8a8a";

                return {
                    color: "#" + colour,
                    borderColor: "#" + colour,
                    backgroundColor: "#" + colour + "1f"
                };
            },

            fmtRank(value) {
                if (value === null || value === undefined) return "-";
                return "#" + Number(value).toLocaleString();
            },
            fmtPlaytime(seconds) {
                const total = Number(seconds);

                if (!total || total < 0) return "0 minutes";

                const days = Math.floor(total / 86400);
                const hours = Math.floor((total % 86400) / 3600);
                const minutes = Math.floor((total % 3600) / 60);

                const parts = [];

                if (days) parts.push(days + (days === 1 ? " day" : " days"));
                if (hours) parts.push(hours + (hours === 1 ? " hour" : " hours"));
                if (minutes && parts.length < 2) {
                    parts.push(minutes + (minutes === 1 ? " minute" : " minutes"));
                }

                return parts.slice(0, 2).join(" ") || "0 minutes";
            },
            // The mod bits the client sends, minus the ones implied by
            // another mod, so NC does not show up next to DT.
            // When lazerScore is 0 (or absent), the score was set on osu!stable
            // and gets the Classic (CL) mod prepended — matching official osu! behaviour.
            fmtMods(mods, lazerScore) {
                const value = Number(mods);
                const isStable = !lazerScore || Number(lazerScore) === 0;

                const table = [
                    [1, "NF"], [2, "EZ"], [4, "TD"], [8, "HD"], [16, "HR"],
                    [32, "SD"], [64, "DT"], [128, "RX"], [256, "HT"],
                    [512, "NC"], [1024, "FL"], [2048, "AT"], [4096, "SO"],
                    [8192, "AP"], [16384, "PF"], [32768, "4K"], [65536, "5K"],
                    [131072, "6K"], [262144, "7K"], [524288, "8K"],
                    [1048576, "FI"], [2097152, "RD"], [4194304, "CN"],
                    [8388608, "TP"], [16777216, "9K"], [33554432, "CO"],
                    [67108864, "1K"], [134217728, "3K"], [268435456, "2K"],
                    [536870912, "V2"], [1073741824, "MR"]
                ];

                const names = isStable ? ["CL"] : [];

                if (value) {
                    for (const [bit, name] of table) {
                        if ((value & bit) === 0) continue;
                        // NC always carries DT, PF always carries SD.
                        if (name === "DT" && (value & 512)) continue;
                        if (name === "SD" && (value & 16384)) continue;

                        names.push(name);
                    }
                }

                return names;
            },

            asDate(value) {
                if (value === null || value === undefined || value === "") return null;

                if (typeof value === "number" || /^[0-9]+$/.test(String(value))) {
                    const number = Number(value);

                    if (!number) return null;

                    return new Date(number < 100000000000 ? number * 1000 : number);
                }

                const date = new Date(value);

                return isNaN(date.getTime()) ? null : date;
            },
            fmtRelative(value) {
                const date = this.asDate(value);

                if (!date) return "-";

                const seconds = Math.max(0, (Date.now() - date.getTime()) / 1000);
                const steps = [
                    [31536000, "year"], [2592000, "month"], [604800, "week"],
                    [86400, "day"], [3600, "hour"], [60, "minute"]
                ];

                for (const [span, name] of steps) {
                    if (seconds >= span) {
                        const count = Math.floor(seconds / span);
                        return count + " " + name + (count === 1 ? "" : "s") + " ago";
                    }
                }

                return "just now";
            },
            fmtDate(value) {
                const date = this.asDate(value);

                return date ? date.toLocaleDateString() : "-";
            },
            setTitle(text) {
                const name = koneko.site && koneko.site.name ? koneko.site.name : "koneko";
                document.title = text ? text + " | " + name : name;
            }
        }
    });
</script>

<script>

    app.mixin({
        methods: {

            pluginData(pluginId, key, fallback) {
                const data = (koneko.plugins && koneko.plugins.data) || {};
                const own = data[pluginId] || {};
                const value = key === undefined ? own : own[key];

                return value === undefined ? (fallback === undefined ? null : fallback) : value;
            },

            pluginAsset(pluginId, path) {
                return "/plugin-assets/" + pluginId + (path.startsWith("/") ? path : "/" + path);
            },

            pluginAction(pluginId, path) {
                return "/plugins/" + pluginId + (path.startsWith("/") ? path : "/" + path);
            },

            pluginNav(placement) {
                const items = (koneko.plugins && koneko.plugins.nav) || [];

                return placement === "footer" ? items.filter(item => item.footer) : items;
            },

            pluginNavHidden() {
                return (koneko.plugins && koneko.plugins.navHidden) || [];
            },
            pluginLoaded(pluginId) {
                const ids = (koneko.plugins && koneko.plugins.ids) || [];

                return ids.indexOf(pluginId) !== -1;
            }
        }
    });

    app.component("koneko-slot", {
        props: {
            name: { type: String, required: true },

            context: { type: Object, default: null }
        },
        computed: {
            entries() {
                const slots = (koneko.plugins && koneko.plugins.slots) || {};

                return slots[this.name] || [];
            }
        },
        template: `<template v-for="(entry, index) in entries" :key="entry.pluginId + ':' + index">
            <component :is="entry.component" v-bind="entry.props" :slot-context="context"></component>
        </template>`
    });
</script>

@componentRegistration

<script>
    window.__konekoRoot = app.mount("#koneko-app");
</script>

<script>
    // Navbar: full at the top of the page, compact once scrolled. Two thresholds so the bar does not
    // flicker around a single scroll position.
    (function navShrink() {
        const root = document.documentElement;
        let ticking = false;

        function update() {
            ticking = false;
            const y = window.scrollY || 0;
            if (y > 48) root.classList.add("nav-compact");
            else if (y < 12) root.classList.remove("nav-compact");
        }

        window.addEventListener("scroll", function () {
            if (!ticking) { ticking = true; window.requestAnimationFrame(update); }
        }, { passive: true });
        update();
    })();
</script>

<script src="/js/turbo.js?v=turbo-1"></script>

@pluginBody

</body>
</html>
