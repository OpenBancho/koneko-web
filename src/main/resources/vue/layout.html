<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>koneko</title>
    <!--
        flag-icons ships one SVG per country and addresses them with a
        class, so flags look the same on every system instead of relying
        on the emoji font, which Windows does not have.

        The integrity hash is what makes a third-party stylesheet on this
        origin acceptable: a version tag pins which release was asked for,
        not what the CDN answers with. The browser drops the file if the
        bytes ever stop matching. Hash verified against the flag-icons
        7.2.3 tarball on registry.npmjs.org; recompute it when the version
        changes, or the stylesheet stops loading.
    -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flag-icons@7.2.3/css/flag-icons.min.css"
        integrity="sha384-aQuvIWWIbpu/mSqULLDiUveyYiPoJzPKAWjUmGJ+Elm+N/LJhzfZqsutsfw870JS"
        crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
    <!-- The query is bumped whenever koneko.css changes so browsers cannot keep
         serving a stale stylesheet out of their disk cache. -->
    <link rel="stylesheet" href="/css/koneko.css?v=theme-sandbox-1">

    <!-- The beatmap listing and the beatmap page bring their own layout. It is
         loaded after koneko.css on purpose: a handful of its rules restate an
         earlier selector and have to win on order. -->
    <link rel="stylesheet" href="/css/beatmaps.css?v=beatmaps-layout-1">

    <!-- The front page panels, the restriction strip, and the Markdown pages. -->
    <link rel="stylesheet" href="/css/home-panels.css?v=home-panels-13">


    <!-- Stylesheets and head html contributed by .jar plugins. -->
@pluginHead
</head>
<body>

<!-- Keyboard users get past the navigation without tabbing through it. -->
<a class="skip-link" href="#koneko-app">Skip to content</a>

<main id="koneko-app" tabindex="-1" v-cloak>
    <theme-runtime></theme-runtime>
    @routeComponent
</main>

<!--
    The page state is served as a normal blocking script, so the site texts and
    the logged in user are on the page before Vue runs. See DataRoutes.
-->
<script src="/data/bootstrap.js"></script>

<!--
    Vue runs on this origin with the visitor's session, so it is the most
    privileged script on the page - it can reach every form and call the API
    as whoever is logged in. The integrity hash is therefore not optional
    hardening: @3.5.13 pins the version that was asked for, and the hash pins
    the bytes that come back. Without it, a compromised or misdirected CDN
    answer executes with full privileges and nothing here would notice.

    Hash verified against the vue 3.5.13 tarball on registry.npmjs.org.
    Recompute it when the version changes, or the page stops loading Vue:
        openssl dgst -sha384 -binary vue.global.prod.js | openssl base64 -A
-->
<script src="https://unpkg.com/vue@3.5.13/dist/vue.global.prod.js"
    integrity="sha384-W/1Fp/LgAYO/oTn9Gs+PbeWuMuq1eQCnUMPCeg8POmMYchhzxctjEqtbiCIxDOON"
    crossorigin="anonymous"></script>

<script>
    // The app has to exist before the components are registered: every
    // component inlined below registers itself on this exact variable.
    const koneko = window.__koneko || { site: {}, user: null, domain: "" };

    const app = Vue.createApp({});

    app.config.globalProperties.$koneko = koneko;

    // Formatting helpers every component needs, kept in one place.
    app.mixin({
        methods: {
            // FastLoad, browser side: the last answer of a page is kept in
            // localStorage, painted immediately on the next visit and then
            // replaced by the fresh one. Only public page data goes in here.
            fastKey(key) {
                return "koneko:fast:" + key;
            },
            fastLoad(key) {
                const settings = koneko.fastload || {};

                if (!settings.enabled) return null;

                try {
                    const raw = window.localStorage.getItem(this.fastKey(key));
                    if (!raw) return null;

                    const entry = JSON.parse(raw);
                    if (!entry || !entry.body) return null;

                    const ttl = (settings.clientTtl || 0) * 1000;

                    if (ttl > 0 && Date.now() - entry.storedAt > ttl) {
                        window.localStorage.removeItem(this.fastKey(key));
                        return null;
                    }

                    return entry.body;
                } catch (e) {
                    return null;
                }
            },
            fastSave(key, body) {
                const settings = koneko.fastload || {};

                if (!settings.enabled || !body) return;

                try {
                    window.localStorage.setItem(this.fastKey(key), JSON.stringify({
                        storedAt: Date.now(),
                        body: body
                    }));
                } catch (e) {
                    // A full or blocked storage is not worth a broken page.
                }
            },
            // The bancho.jar API is reachable under /api/v1 on this very
            // origin, so public page data is fetched from it directly instead
            // of going browser -> koneko-web -> API. One hop, no CORS, and no
            // token involved: none of these endpoints need one.
            apiBase() {
                return String(koneko.apiBase || "/api/v1").replace(/\/+$/, "");
            },
            /**
             * GETs one API endpoint and returns the parsed body.
             *
             * Empty, null and undefined parameters are dropped, so callers can
             * hand over their whole state without filtering it first.
             */
            async api(endpoint, params) {
                const query = new URLSearchParams();

                Object.keys(params || {}).forEach(name => {
                    const value = params[name];

                    if (value === null || value === undefined || value === "") return;

                    query.set(name, String(value));
                });

                const suffix = query.toString() ? "?" + query.toString() : "";

                const response = await fetch(this.apiBase() + "/" + endpoint + suffix, {
                    headers: { "Accept": "application/json" },
                    // The API is a different service behind the same host and
                    // has no use for the frontend session cookie.
                    credentials: "omit"
                });

                if (!response.ok) {
                    const error = new Error(endpoint + " answered " + response.status);
                    error.status = response.status;
                    throw error;
                }

                return await response.json();
            },
            // The same call, but a failure gives null instead of throwing: a
            // secondary section of a page should grey out on its own rather
            // than take the whole page down.
            async apiQuietly(endpoint, params) {
                try {
                    return await this.api(endpoint, params);
                } catch (e) {
                    return null;
                }
            },
            /**
             * A player endpoint, asked through this service rather than
             * straight from the API.
             *
             * A profile is the one kind of page data that does not answer
             * everybody the same: a restricted account is a 404 to players and
             * an ordinary profile to staff, and only the access token in the
             * session here can tell the API which of the two is asking. So the
             * cookie is sent, this service adds the token, and the answer is
             * the API's own body and status.
             */
            async playerApi(endpoint, params) {
                const query = new URLSearchParams();

                Object.keys(params || {}).forEach(name => {
                    const value = params[name];

                    if (value === null || value === undefined || value === "") return;

                    query.set(name, String(value));
                });

                const suffix = query.toString() ? "?" + query.toString() : "";

                const response = await fetch("/data/player/" + endpoint + suffix, {
                    headers: { "Accept": "application/json" },
                    credentials: "same-origin"
                });

                if (!response.ok) {
                    const error = new Error(endpoint + " answered " + response.status);
                    error.status = response.status;
                    throw error;
                }

                return await response.json();
            },
            // The same call, with a failure giving null instead of throwing.
            async playerApiQuietly(endpoint, params) {
                try {
                    return await this.playerApi(endpoint, params);
                } catch (e) {
                    return null;
                }
            },
            /**
             * A call to this service instead of the API: the account routes,
             * which need the access token that lives in the session here. The
             * cookie is sent, the token is never seen by the browser, and the
             * answer is the API's own body.
             *
             * Throws with .status and .message set to what the API said, so a
             * form can print "wrong password" instead of a status code.
             */
            async session(method, path, body) {
                const response = await fetch(path, {
                    method: method,
                    headers: {
                        "Accept": "application/json",
                        "Content-Type": "application/json"
                    },
                    credentials: "same-origin",
                    body: body === undefined ? undefined : JSON.stringify(body)
                });

                let answer = null;

                try {
                    answer = await response.json();
                } catch (e) {
                    answer = null;
                }

                if (!response.ok) {
                    const error = new Error((answer && answer.status)
                        || "The server could not be reached.");
                    error.status = response.status;
                    throw error;
                }

                return answer;
            },
            // The player of a profile url: a numeric segment is an id,
            // anything else a name, the way the API expects it.
            apiWho(identifier) {
                const value = String(identifier === null || identifier === undefined
                    ? "" : identifier);

                return /^[0-9]+$/.test(value) ? { id: value } : { name: value };
            },
            fmtNumber(value) {
                return (value === null || value === undefined) ? "-" : Number(value).toLocaleString();
            },
            fmtDecimal(value, digits) {
                if (value === null || value === undefined) return "-";
                return Number(value).toFixed(digits === undefined ? 2 : digits);
            },
            fmtAccuracy(value) {
                if (value === null || value === undefined) return "-";
                // The API stores accuracy as a fraction of 1.
                return (Number(value) * 100).toFixed(2) + "%";
            },
            // Shared beatmap helpers: every page that shows a map needs the
            // same status names, mode names, lengths and cover urls.
            statusName(status) {
                const names = {
                    "-2": "graveyard",
                    "-1": "work in progress",
                    "0": "pending",
                    "1": "ranked",
                    "2": "approved",
                    "3": "qualified",
                    "4": "loved"
                };

                return names[String(status)] || "unknown";
            },
            modeName(mode) {
                const names = ["osu!", "taiko", "catch", "mania"];
                return names[Number(mode)] || "osu!";
            },
            fmtLength(seconds) {
                const total = Number(seconds);

                if (!total || total < 0) return "0:00";

                const minutes = Math.floor(total / 60);
                const rest = Math.floor(total % 60);

                return minutes + ":" + String(rest).padStart(2, "0");
            },
            // osu! hosts the set banners. Sets submitted here have none, so
            // every image falls back to a plain gradient on error.
            coverUrl(setId, size) {
                if (!setId) return "";

                return "https://assets.ppy.sh/beatmaps/" + setId + "/covers/"
                    + (size || "card") + "@2x.jpg";
            },
            // The flag-icons classes for a country code. The flag itself
            // is a background image, so the element carrying these classes
            // stays empty. An unknown code gives no class at all, which
            // leaves an empty box rather than a wrong flag.
            flagClass(code) {
                if (!code) return "";

                const value = String(code).trim().toLowerCase();

                if (!/^[a-z]{2}$/.test(value)) return "";

                return "fi fi-" + value;
            },
            // The inline colours of a group badge, built from its six digit
            // hex colour. Anything malformed falls back to grey.
            groupStyle(group) {
                const raw = String((group && group.colour) || "");
                const colour = /^[0-9a-fA-F]{6}$/.test(raw) ? raw : "8a8a8a";

                return {
                    color: "#" + colour,
                    borderColor: "#" + colour,
                    backgroundColor: "#" + colour + "1f"
                };
            },
            // Profile helpers.
            fmtRank(value) {
                if (value === null || value === undefined) return "-";
                return "#" + Number(value).toLocaleString();
            },
            fmtPlaytime(seconds) {
                const total = Number(seconds);

                if (!total || total < 0) return "0 minutes";

                const days = Math.floor(total / 86400);
                const hours = Math.floor((total % 86400) / 3600);
                const minutes = Math.floor((total % 3600) / 60);

                // The two largest units that are not zero, the way the
                // client puts it: "14 days 22 minutes".
                const parts = [];

                if (days) parts.push(days + (days === 1 ? " day" : " days"));
                if (hours) parts.push(hours + (hours === 1 ? " hour" : " hours"));
                if (minutes && parts.length < 2) {
                    parts.push(minutes + (minutes === 1 ? " minute" : " minutes"));
                }

                return parts.slice(0, 2).join(" ") || "0 minutes";
            },
            // The mod bits the client sends, minus the ones implied by
            // another mod, so NC does not show up next to DT.
            fmtMods(mods) {
                const value = Number(mods);

                if (!value) return [];

                const table = [
                    [1, "NF"], [2, "EZ"], [4, "TD"], [8, "HD"], [16, "HR"],
                    [32, "SD"], [64, "DT"], [128, "RX"], [256, "HT"],
                    [512, "NC"], [1024, "FL"], [2048, "AT"], [4096, "SO"],
                    [8192, "AP"], [16384, "PF"], [32768, "4K"], [65536, "5K"],
                    [131072, "6K"], [262144, "7K"], [524288, "8K"],
                    [1048576, "FI"], [2097152, "RD"], [4194304, "CN"],
                    [8388608, "TP"], [16777216, "9K"], [33554432, "CO"],
                    [67108864, "1K"], [134217728, "3K"], [268435456, "2K"],
                    [536870912, "V2"], [1073741824, "MR"]
                ];

                const names = [];

                for (const [bit, name] of table) {
                    if ((value & bit) === 0) continue;
                    // NC always carries DT, PF always carries SD.
                    if (name === "DT" && (value & 512)) continue;
                    if (name === "SD" && (value & 16384)) continue;

                    names.push(name);
                }

                return names;
            },
            // Unix seconds, milliseconds and date strings all end up here.
            asDate(value) {
                if (value === null || value === undefined || value === "") return null;

                if (typeof value === "number" || /^[0-9]+$/.test(String(value))) {
                    const number = Number(value);

                    if (!number) return null;
                    // Anything this small has to be seconds, not millis.
                    return new Date(number < 100000000000 ? number * 1000 : number);
                }

                const date = new Date(value);

                return isNaN(date.getTime()) ? null : date;
            },
            fmtRelative(value) {
                const date = this.asDate(value);

                if (!date) return "-";

                const seconds = Math.max(0, (Date.now() - date.getTime()) / 1000);
                const steps = [
                    [31536000, "year"], [2592000, "month"], [604800, "week"],
                    [86400, "day"], [3600, "hour"], [60, "minute"]
                ];

                for (const [span, name] of steps) {
                    if (seconds >= span) {
                        const count = Math.floor(seconds / span);
                        return count + " " + name + (count === 1 ? "" : "s") + " ago";
                    }
                }

                return "just now";
            },
            fmtDate(value) {
                const date = this.asDate(value);

                return date ? date.toLocaleDateString() : "-";
            },
            setTitle(text) {
                const name = koneko.site && koneko.site.name ? koneko.site.name : "koneko";
                document.title = text ? text + " | " + name : name;
            }
        }
    });
</script>

<script>
    // The plugin side of the front end. Everything a plugin contributed to a
    // page arrives in koneko.plugins, so no component has to fetch anything to
    // know what is loaded.
    app.mixin({
        methods: {
            // A state key contributed by a plugin, e.g.
            // $options ... this.pluginData("tournaments", "upcoming").
            pluginData(pluginId, key, fallback) {
                const data = (koneko.plugins && koneko.plugins.data) || {};
                const own = data[pluginId] || {};
                const value = key === undefined ? own : own[key];

                return value === undefined ? (fallback === undefined ? null : fallback) : value;
            },
            // The url of a file a plugin ships in its jar.
            pluginAsset(pluginId, path) {
                return "/plugin-assets/" + pluginId + (path.startsWith("/") ? path : "/" + path);
            },
            // The url of one of a plugin's own endpoints.
            pluginAction(pluginId, path) {
                return "/plugins/" + pluginId + (path.startsWith("/") ? path : "/" + path);
            },
            // The navigation entries plugins added, already filtered by the
            // server to what this visitor may see.
            pluginNav(placement) {
                const items = (koneko.plugins && koneko.plugins.nav) || [];

                return placement === "footer" ? items.filter(item => item.footer) : items;
            },
            // Ids of the navigation entries plugins asked to hide, core ones
            // included. See registry.hideNavItem(id).
            pluginNavHidden() {
                return (koneko.plugins && koneko.plugins.navHidden) || [];
            },
            pluginLoaded(pluginId) {
                const ids = (koneko.plugins && koneko.plugins.ids) || [];

                return ids.indexOf(pluginId) !== -1;
            }
        }
    });

    // A slot: every component plugins registered for this name, in the order
    // they asked for. Unknown slots simply render nothing, so a page may open
    // as many as it likes.
    app.component("koneko-slot", {
        props: {
            name: { type: String, required: true },
            // Whatever the surrounding page knows: the player on a profile, the
            // set on a beatmap page. Handed to every component as slotContext.
            context: { type: Object, default: null }
        },
        computed: {
            entries() {
                const slots = (koneko.plugins && koneko.plugins.slots) || {};

                return slots[this.name] || [];
            }
        },
        template: `<template v-for="(entry, index) in entries" :key="entry.pluginId + ':' + index">
            <component :is="entry.component" v-bind="entry.props" :slot-context="context"></component>
        </template>`
    });
</script>

@componentRegistration

<script>
    app.mount("#koneko-app");
</script>

<!-- Scripts and body html contributed by .jar plugins. -->
@pluginBody

</body>
</html>
