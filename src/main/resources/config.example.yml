# koneko-web site configuration.
#
# This file holds the texts of the site. It is re-read on every start, so a
# restart is enough to change anything here - no rebuild needed.
# Copy it to .config/config.yml, which is where the site reads it from.

server:
  # The name of your osu! server. This is NOT the name of this project:
  # it shows up in the navigation bar, the page titles and the footer.
  name: "Your Server"

  # Optional one-liner under the server name in the navigation bar.
  tagline: "play, submit, rank"

  # The description on the front page. Plain text; line breaks are kept.
  description: |
    Write the description of your server here. Plain text, blank lines make
    paragraphs.

    This text lives in .config/config.yml, so changing it only needs a
    restart.

links:
  # Discord invite. Leave empty to hide the button.
  discord: "https://discord.gg/your-invite"

  # Optional extra links. Empty values are hidden.
  github: ""
  api_docs: ""

home:
  # Show the online/registered/maps/scores counters.
  show_stats: true

  # Show the top players table and how many rows it has.
  show_leaderboard: true
  leaderboard_size: 5

  # Game mode the front page leaderboard uses (0 = osu!standard).
  leaderboard_mode: 0

  # Show the "new players" panel and how many rows it has.
  show_new_players: true
  new_players_size: 5

  # Show the "best scores" panel (highest pp plays) and how many rows it has.
  show_top_scores: true
  top_scores_size: 5

  # Show the "how to connect" block with the -devserver instructions.
  show_connect_guide: true

  # Background image or video (.mp4) of the welcome band on the front page. Any URL or /logo.mp4.
  # Leave empty for the plain purple gradient.
  hero_image: "/logo.mp4"

  # Server logo, shown in the navigation bar and on the welcome band.
  # Leave empty to use the initials of the server name instead.
  logo_image: ""

  # One line strip above the welcome band, for news and recruitment.
  # Leave empty to hide the strip entirely.
  announcement: ""
  announcement_link: ""

# Settings of the .jar plugins. Everything under a plugin id is handed to that
# plugin as its settings, so a plugin can be configured without touching its
# jar. A plugin may also read .config/plugins/{id}.yml instead; that file wins
# over the values here.
plugins:
  # false starts the site with no plugin at all, which is the way back in
  # after a bad jar.
  enabled: true

  # Plugin ids that must stay off, even though their jar is in place.
  disabled: []

